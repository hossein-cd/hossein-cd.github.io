<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c121c">
<title>Hossein Soroushpour</title>
<meta name="description" content="Digital marketing, content and political philosophy — posters, video and writing by Hossein Soroushpour.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- the field: one thin repeating figure, nothing more ---------- */
#pat{position:fixed;inset:-8%;width:116%;height:116%;z-index:1;opacity:.16;pointer-events:none;
  transition:opacity .9s,transform 1.2s var(--ease)}
#pat g{stroke:var(--accent)}
body.open #pat{opacity:.06;transform:scale(1.1) rotate(2deg)}

header{position:fixed;top:0;inset-inline:0;z-index:30;display:flex;justify-content:center;
  padding:26px 20px;transition:opacity .45s}
header span{font-size:11px;letter-spacing:.3em;opacity:.6}
[dir=rtl] header span{letter-spacing:.12em}
body.open header{opacity:0;pointer-events:none}

.home{position:relative;z-index:10;min-height:100dvh;display:grid;place-items:center;
  padding:96px 5vw 104px;transition:opacity .5s,transform .8s var(--ease)}
body.open .home{opacity:0;transform:scale(.96);pointer-events:none}
.hero{text-align:center;max-width:min(940px,92vw)}
.hero .who{font-size:12px;letter-spacing:.24em;opacity:.45;margin-bottom:22px}
[dir=rtl] .hero .who{letter-spacing:.08em}
.hero h1{font-size:clamp(29px,5.4vw,60px);font-weight:200}
.hero h1 b{font-weight:200;opacity:.5;display:block}
.hero p{margin-top:20px;font-size:14px;opacity:.55;line-height:1.85;max-width:46ch;margin-inline:auto}

/* ---------- four tiles ---------- */
.tiles{display:flex;justify-content:center;gap:clamp(10px,1.6vw,20px);margin-top:clamp(40px,7vh,72px);flex-wrap:wrap}
.tile{position:relative;width:clamp(128px,15vw,164px);aspect-ratio:1;cursor:pointer;
  display:grid;place-items:center;background:none;border:none;padding:0;
  font-family:var(--font);color:var(--ink);   /* buttons do not inherit the family */
  transition:transform .5s var(--ease)}
.tile svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* a square is symmetric every 90°, so the two must stay exactly 45° apart or
   they land on top of each other instead of crossing into an eight-point star */
.tile .a,.tile .b{fill:none;stroke-width:1.7;transform-origin:50% 50%;
  transition:stroke .45s,stroke-opacity .45s,transform .8s var(--ease)}
.tile .a{stroke:var(--line-hi);transform:rotate(0deg)}
.tile .b{stroke:var(--accent);stroke-opacity:0;transform:rotate(45deg)}
.tile:hover,.tile:focus-visible{transform:translateY(-7px);outline:none}
.tile:hover .a,.tile:focus-visible .a{stroke:var(--accent);transform:rotate(22.5deg)}
.tile:hover .b,.tile:focus-visible .b{stroke-opacity:.85;transform:rotate(67.5deg)}
.tile em{position:absolute;top:10px;inset-inline-start:12px;font-style:normal;font-size:11px;opacity:.35}
.tile span{position:relative;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;
  text-align:center;line-height:1.5;transition:opacity .4s;padding:0 12px;color:var(--ink)}
[dir=rtl] .tile span{letter-spacing:.04em;text-transform:none;font-size:15px}
.tile:hover span{opacity:1}

/* ---------- the chamber ---------- */
.chamber{position:fixed;inset:0;z-index:25;visibility:hidden;
  background:var(--panel)}
body.open .chamber{visibility:visible}
.frame{position:absolute;inset:clamp(14px,3vh,46px) clamp(14px,3vw,46px);pointer-events:none}
.frame rect{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:400;stroke-dashoffset:400;opacity:.6;
  vector-effect:non-scaling-stroke}
body.open .frame rect{animation:draw 1.4s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.inner{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:clamp(74px,12vh,132px) clamp(24px,6vw,72px) clamp(96px,14vh,140px);
  opacity:0;transform:translateY(18px);transition:opacity .55s .4s,transform .7s .4s}
body.open .inner{opacity:1;transform:none}

@media(max-width:620px){
  .tile{width:calc(50% - 8px);aspect-ratio:1.35}
  .tile span{font-size:11px;letter-spacing:.1em}
  [dir=rtl] .tile span{font-size:13.5px}
}
</style>
</head>
<body>
<div class="sky"></div>
<svg id="pat" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <pattern id="g" width="128" height="128" patternUnits="userSpaceOnUse">
    <g fill="none" stroke-width=".8">
      <rect x="22" y="22" width="84" height="84"/>
      <rect x="22" y="22" width="84" height="84" transform="rotate(45 64 64)"/>
      <circle cx="64" cy="64" r="42" stroke-opacity=".5"/>
    </g></pattern></defs>
  <rect width="100%" height="100%" fill="url(#g)"/></svg>
<div class="grain"></div>

<header><span id="who"></span></header>
<button class="shut" id="shutb" type="button">close</button>

<main class="home"><div class="hero">
  <div class="who" id="role"></div>
  <h1 id="h1"></h1>
  <p id="hsub"></p>
  <div class="tiles" id="tiles"></div>
</div></main>

<div class="chamber">
  <svg class="frame" preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true">
    <rect x=".5" y=".5" width="99" height="99"/></svg>
  <div class="inner" id="inner"></div>
</div>

<div class="lang">
  <button class="on" data-l="en" type="button">EN</button><i></i>
  <button class="fa" data-l="fa" type="button">فارسی</button>
</div>

<script src="content.js"></script>
<script src="essays.js"></script>
<script src="ui.js"></script>
<script>
const STAR=`<svg viewBox="0 0 100 100" aria-hidden="true"><g>
  <rect class="a" x="18" y="18" width="64" height="64"/>
  <rect class="b" x="18" y="18" width="64" height="64"/></g></svg>`;
let lang='en',current=null;
const $=id=>document.getElementById(id);


function render(){
  const rtl=lang==='fa';
  document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';
  document.body.dir=rtl?'rtl':'ltr';
  UI.lang=lang;UI.stopAll();UI.closeOverlays();
  const T=UI.t;
  $('who').textContent=T(DATA.meta.name,'meta.name');
  $('role').textContent=T(DATA.meta.role,'meta.role');
  $('h1').innerHTML=(DATA.meta.hero[lang]||DATA.meta.hero.en)
    .map((l,i)=>i?`<b>${l}</b>`:l).join('');
  $('hsub').textContent=T(DATA.meta.heroSub,'meta.heroSub');
  $('shutb').textContent=T(DATA.ui.close);
  $('tiles').innerHTML=DATA.order.map(k=>{const d=DATA[k];
    return `<button class="tile" data-k="${k}" type="button">
      <em>${d.num}</em>${STAR}<span>${T(d.title,k)}</span></button>`;}).join('');
  document.querySelectorAll('.tile').forEach(el=>el.onclick=()=>open_(el.dataset.k));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  if(current)fill(current);
}
function fill(k){const inn=$('inner');inn.innerHTML=UI.section(k);UI.bind(inn);inn.scrollTop=0}
function open_(k){
  current=k;fill(k);
  document.body.classList.remove('open');void document.body.offsetWidth;
  document.body.classList.add('open');
}
function shut(){current=null;UI.stopAll();UI.closeOverlays();document.body.classList.remove('open')}
$('shutb').onclick=shut;
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('open')&&
     !document.querySelector('.reader.on,.box.on')) shut();
});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
render();
</script>
</body>
</html>
