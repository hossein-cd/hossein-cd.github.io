<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241f1d">
<title>Hossein Soroushpour</title>
<meta name="description" content="Digital marketing, content and political philosophy — posters, video and writing by Hossein Soroushpour.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- the vault: four lines and an arc. that is the whole drawing ---------- */
#vault{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
  transition:transform 1.1s var(--ease),opacity .8s}
body.open #vault{transform:scale(1.22);opacity:.25}
#vault path,#vault line{fill:none;stroke:var(--gold);vector-effect:non-scaling-stroke}

header{position:fixed;top:0;inset-inline:0;z-index:30;display:flex;justify-content:center;
  padding:26px 20px;transition:opacity .45s}
header span{font-size:11px;letter-spacing:.3em;opacity:.6}
[dir=rtl] header span{letter-spacing:.12em}
body.open header{opacity:0;pointer-events:none}

.home{position:relative;z-index:10;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(34px,7vh,72px);
  padding:96px 5vw 104px;transition:opacity .5s,transform .8s var(--ease)}
body.open .home{opacity:0;transform:translateY(-18px) scale(.98);pointer-events:none}
.hero{text-align:center;max-width:min(900px,92vw)}
.hero h1{font-size:clamp(29px,5.4vw,60px);font-weight:200}
.hero h1 b{font-weight:200;opacity:.5;display:block}
.hero .who{font-size:12px;letter-spacing:.24em;opacity:.45;margin-bottom:22px}
[dir=rtl] .hero .who{letter-spacing:.08em}
.hero p{margin-top:20px;font-size:14px;opacity:.55;line-height:1.85}

/* ---------- the four doors ---------- */
.colonnade{display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(10px,1.8vw,22px);width:100%;max-width:1080px}
.arch{position:relative;flex:1 1 0;min-width:0;height:clamp(180px,32vh,300px);cursor:pointer;
  border:1px solid var(--line);border-bottom:none;
  border-radius:50% 50% 0 0 / 32% 32% 0 0;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 8px 24px;overflow:hidden;
  transition:transform .55s var(--ease),border-color .4s,background .5s}
.arch::before{content:'';position:absolute;left:50%;bottom:-46%;width:130%;height:86%;
  transform:translateX(-50%);border-radius:50%;opacity:0;transition:opacity .45s;
  background:radial-gradient(ellipse,rgba(217,164,65,.30),transparent 66%)}
.arch:hover,.arch:focus-visible{transform:translateY(-8px);border-color:var(--line-hi);outline:none}
.arch:hover::before,.arch:focus-visible::before{opacity:1}
.arch b{position:relative;font-size:11px;font-weight:300;opacity:.4;margin-bottom:9px;letter-spacing:.1em}
.arch span{position:relative;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  opacity:.7;text-align:center;line-height:1.5;transition:opacity .35s}
[dir=rtl] .arch span{letter-spacing:.04em;text-transform:none;font-size:15px}
.arch:hover span{opacity:1}
.plinth{width:100%;max-width:1080px;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-hi) 14%,var(--line-hi) 86%,transparent)}

/* ---------- walking through ---------- */
.through{position:fixed;z-index:25;border:1px solid var(--line-hi);border-bottom:none;
  background:linear-gradient(178deg,#2e2825 0%,#262120 46%,#211e20 100%);
  border-radius:50% 50% 0 0 / 32% 32% 0 0;overflow:hidden;opacity:0;pointer-events:none;
  transition:left .9s var(--ease),top .9s var(--ease),width .9s var(--ease),
             height .9s var(--ease),border-radius .9s var(--ease),opacity .3s}
body.open .through{opacity:1;pointer-events:auto}
.inner{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:clamp(74px,12vh,140px) clamp(20px,5vw,64px) clamp(96px,14vh,140px);
  opacity:0;transform:translateY(16px);transition:opacity .55s .45s,transform .7s .45s}
body.open .inner{opacity:1;transform:none}

@media(max-width:820px){
  .colonnade{flex-wrap:wrap;gap:10px}
  .arch{flex:1 1 44%;height:clamp(126px,17vh,168px);padding-bottom:16px}
  .arch span{font-size:11px;letter-spacing:.1em}
  [dir=rtl] .arch span{font-size:13.5px}
}
</style>
</head>
<body>
<div class="sky"></div>
<svg id="vault" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<div class="grain"></div>

<header><span id="who"></span></header>
<button class="shut" id="shutb" type="button">close</button>

<main class="home">
  <div class="hero">
    <div class="who" id="role"></div>
    <h1 id="h1"></h1>
    <p id="hsub"></p>
  </div>
  <div style="width:100%;max-width:1080px">
    <div class="colonnade" id="colonnade"></div>
    <div class="plinth"></div>
  </div>
</main>

<div class="through" id="through"><div class="inner" id="inner"></div></div>

<div class="lang">
  <button class="on" data-l="en" type="button">EN</button><i></i>
  <button class="fa" data-l="fa" type="button">فارسی</button>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script>
/* minimal vault: three receding arcs and the floor lines */
(function(){
  const VX=500,VY=298;let h='';
  [1,.66,.44].forEach((s,k)=>{
    h+=`<path d="M70,620 L70,298 A430,298 0 0 1 930,298 L930,620"
        transform="translate(${VX},${VY}) scale(${s}) translate(${-VX},${-VY})"
        stroke-opacity="${(.24-k*.06).toFixed(2)}" stroke-width="1"/>`;});
  [70,320,680,930].forEach(x=>
    h+=`<line x1="${x}" y1="620" x2="${VX}" y2="${VY}" stroke-opacity=".09"/>`);
  document.getElementById('vault').innerHTML=h;
})();
addEventListener('pointermove',e=>{
  if(document.body.classList.contains('open'))return;
  const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  document.getElementById('vault').style.transform=`translate(${-x*20}px,${-y*12}px) scale(1.03)`;
},{passive:true});

let lang='en',current=null;
const $=id=>document.getElementById(id);

function render(){
  const rtl=lang==='fa';
  document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';
  document.body.dir=rtl?'rtl':'ltr';
  UI.lang=lang;UI.stopAll();UI.closeOverlays();
  $('who').textContent=DATA.meta.name[lang];
  $('role').textContent=DATA.meta.role[lang];
  $('h1').innerHTML=DATA.meta.hero[lang].map((l,i)=>i?`<b>${l}</b>`:l).join('');
  $('hsub').textContent=DATA.meta.heroSub[lang];
  $('shutb').textContent=DATA.ui.close[lang];
  $('colonnade').innerHTML=DATA.order.map((k,i)=>{
    const d=DATA[k];
    return `<button class="arch" data-k="${k}" type="button">
      <b>${d.num}</b><span>${d.title[lang]}</span></button>`;}).join('');
  document.querySelectorAll('.arch').forEach(a=>a.onclick=()=>walk(a.dataset.k,a));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  if(current)fill(current);
}

function geometry(open,rect){
  const t=$('through');
  if(open){
    const W=innerWidth,H=innerHeight,narrow=W<820;
    t.style.left=(narrow?0:W*.045)+'px';
    t.style.top=(narrow?0:56)+'px';
    t.style.width=(narrow?W:W*.91)+'px';
    t.style.height=(narrow?H:H-56)+'px';
    t.style.borderRadius=narrow?'0':'20% 20% 0 0 / 11% 11% 0 0';
  }else if(rect){
    t.style.left=rect.left+'px';t.style.top=rect.top+'px';
    t.style.width=rect.width+'px';t.style.height=rect.height+'px';
    t.style.borderRadius='50% 50% 0 0 / 32% 32% 0 0';
  }
}
function fill(k){
  const inn=$('inner');
  inn.innerHTML=UI.section(k);
  UI.bind(inn);
  inn.scrollTop=0;
}
function walk(k,el){
  current=k;fill(k);
  const t=$('through');
  t.style.transition='none';
  geometry(false,el.getBoundingClientRect());
  void t.offsetWidth;
  t.style.transition='';
  document.body.classList.add('open');
  geometry(true);
}
function shut(){
  current=null;UI.stopAll();UI.closeOverlays();
  document.body.classList.remove('open');
  const a=document.querySelector('.arch');
  if(a)geometry(false,a.getBoundingClientRect());
}
$('shutb').onclick=shut;
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('open')&&
     !document.querySelector('.reader.on,.box.on')) shut();
});
addEventListener('resize',()=>{if(document.body.classList.contains('open'))geometry(true)});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
render();
</script>
</body>
</html>
